# Woodpecker CI pipeline.
# Server: ci.lthn.sh. Lint + sonar in parallel, both depend only on clone.
# sonar_token is admin-scoped on the Woodpecker server.

when:
  - event: push
    branch: [dev, main]

steps:
  - name: eslint
    image: node:22-alpine
    depends_on: []
    commands:
      - apk add --no-cache git
      - if [ -f package.json ]; then npm ci || npm install; fi
      - if [ -f .eslintrc.js ] || [ -f .eslintrc.json ] || [ -f eslint.config.js ]; then npx eslint .; else echo 'no eslint config — sonar-only'; fi
  - name: sonar
    image: sonarsource/sonar-scanner-cli:latest
    depends_on: []
    environment:
      SONAR_HOST_URL: https://sonar.lthn.sh
      SONAR_TOKEN:
        from_secret: sonar_token
    commands:
      - sonar-scanner
